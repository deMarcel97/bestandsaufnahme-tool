schema_version: 1
regeln:
  - id: srv-hardware-alt
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: hardware_alter
          operator: gleich
          wert: ueber_5_jahre
    schweregrad: mittel
    befund: Server-Hardware ist älter als 5 Jahre
    risiko: Erhöhte Ausfallwahrscheinlichkeit durch Alterung der Hardwarekomponenten.
    empfehlung: Ersatzbeschaffung der Server-Hosts planen und im Budget berücksichtigen.
    referenz: "BSI IT-Grundschutz"
    massnahme_vorschlag:
      bezeichnung: Erneuerung veralteter Server-Hardware
      kosten_richtwert: 5000
      aufwand_richtwert: 8

  - id: srv-wartungsvertrag-fehlt
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: wartungsvertrag_vorhanden
          operator: gleich
          wert: "nein"
    schweregrad: mittel
    befund: Kein aktiver Wartungsvertrag für Server-Hardware vorhanden
    risiko: Bei Hardware-Defekten fehlen schnelle Vor-Ort-Austauschfristen durch den Hersteller.
    empfehlung: Wartungsvertrag oder Vor-Ort-Servicepaket verlängern bzw. abschließen.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Herstellersupport und Hardware-Wartungsvertrag abschließen
      kosten_richtwert: 0
      aufwand_richtwert: 2

  - id: srv-hypervisor-eol
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: hypervisor_eol
          operator: gleich
          wert: "ja"
    schweregrad: hoch
    befund: Hypervisor-Software ist End-of-Life (EOL)
    risiko: Sicherheitslücken in der Virtualisierungsschicht werden vom Hersteller nicht mehr behoben.
    empfehlung: Upgrade des Hypervisors auf eine vom Hersteller unterstützte Version durchführen.
    referenz: "BSI IT-Grundschutz"
    massnahme_vorschlag:
      bezeichnung: Upgrade der Hypervisor-Software auf eine aktuelle Version
      kosten_richtwert: 0
      aufwand_richtwert: 6

  - id: srv-os-eol
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: os_eol_vms_vorhanden
          operator: gleich
          wert: "ja"
    schweregrad: hoch
    befund: Veraltete Server-Betriebssysteme (EOL) auf virtuellen Maschinen
    risiko: Ungepatchte Betriebssysteme bieten Einfallstore für Schadsoftware im Netzwerk.
    empfehlung: Betriebssysteme der betroffenen virtuellen Maschinen migrieren oder aktualisieren.
    referenz: "BSI IT-Grundschutz"
    massnahme_vorschlag:
      bezeichnung: Migration veralteter Server-Betriebssysteme
      kosten_richtwert: 0
      aufwand_richtwert: 16

  - id: srv-patchstand-veraltet
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: patchstand_aktuell
          operator: gleich
          wert: "nein"
    schweregrad: hoch
    befund: Server- und Hypervisor-Patchstand ist nicht aktuell
    risiko: Bekannte Schwachstellen bleiben unkorrigiert und können ausgenutzt werden.
    empfehlung: Regelmäßiges Patchmanagement für Server und Virtualisierung etablieren.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Einspielen aktueller Sicherheitsupdates für Hypervisor und Server
      kosten_richtwert: 0
      aufwand_richtwert: 4

  - id: srv-kein-ha-cluster
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: ha_cluster_eingerichtet
          operator: gleich
          wert: "nein"
    schweregrad: mittel
    befund: Keine Hochverfügbarkeit (HA-Cluster) für Server-Virtualisierung eingerichtet
    risiko: Beim Ausfall eines physischen Server-Hosts fallen alle darauf laufenden Dienste aus.
    empfehlung: Aufbau eines redundanten HA-Clusters mit automatischem Failover prüfen.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Konzeption und Aufbau eines Server-HA-Clusters
      kosten_richtwert: 4000
      aufwand_richtwert: 24

  - id: srv-netzteil-redundanz-fehlt
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: redundante_netzteil_stromversorgung
          operator: gleich
          wert: "nein"
    schweregrad: mittel
    befund: Keine redundanten Netzteile bei Server-Hosts vorhanden
    risiko: Defekt eines Netzteils führt zum sofortigen Serverausfall.
    empfehlung: Server mit redundanten Netzteilen ausstatten und an getrennte Strompfade anschließen.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Nachrüstung redundanter Netzteile für Server-Hosts
      kosten_richtwert: 500
      aufwand_richtwert: 3

  - id: srv-raid-unsicher
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: raid_konfiguration
          operator: gleich
          wert: raid_0_oder_kein_raid
    schweregrad: hoch
    befund: Server-Datenspeicher ohne RAID-Redundanz (RAID 0 oder kein RAID)
    risiko: Defekt einer einzelnen Festplatte führt zu vollständigem Datenverlust.
    empfehlung: Speichermedien umgehend in ein redundantes RAID-Array (z.B. RAID 1, 5, 6 oder 10) umkonfigurieren.
    referenz: "BSI IT-Grundschutz"
    massnahme_vorschlag:
      bezeichnung: Umstellung des Server-Speichers auf redundante RAID-Konfiguration
      kosten_richtwert: 1000
      aufwand_richtwert: 6

  - id: srv-monitoring-fehlt
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: monitoring_aktiv
          operator: gleich
          wert: "nein"
    schweregrad: mittel
    befund: Kein zentrales Server-Monitoring eingerichtet
    risiko: Engpässe bei Festplattenplatz, RAM, CPU oder Hardwaredefekte werden erst bei Ausfall bemerkt.
    empfehlung: Proaktives Monitoring-System für Server und VMs installieren.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Einrichtung eines proaktiven Monitoring-Systems für Server und VMs
      kosten_richtwert: 1000
      aufwand_richtwert: 6

  - id: srv-dokumentation-fehlt
    gilt_fuer: server_virtualisierung
    bedingung:
      alle:
        - feld: dokumentation_vorhanden
          operator: gleich
          wert: keine
    schweregrad: mittel
    befund: Keine Dokumentation der Server- und Virtualisierungsumgebung vorhanden
    risiko: Erhöhter Zeitaufwand bei Störungsbehebung und Abhängigkeit von Einzelpersonen.
    empfehlung: Systemdokumentation inkl. Netzwerk- und Serverkonfiguration erstellen.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Erstellung einer vollständigen Server- und Virtualisierungsdokumentation
      kosten_richtwert: 0
      aufwand_richtwert: 6
