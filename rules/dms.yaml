schema_version: 1
regeln:
  - id: dms-wartungsvertrag-fehlt
    gilt_fuer: dms
    bedingung:
      alle:
        - feld: wartungsvertrag_support_vorhanden
          operator: gleich
          wert: "nein"
    schweregrad: mittel
    befund: Für das DMS besteht kein Wartungs-/Supportvertrag
    risiko: Bei Störungen oder Fehlern steht kein vereinbarter Herstellersupport zur Verfügung, wodurch sich Ausfallzeiten verlängern können.
    empfehlung: Wartungs-/Supportvertrag beim Hersteller oder Dienstleister abschließen.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Wartungs-/Supportvertrag für DMS abschließen
      kosten_richtwert: 0
      aufwand_richtwert: 2

  - id: dms-datensicherung-fehlt
    gilt_fuer: dms
    bedingung:
      alle:
        - feld: datensicherung_vorhanden
          operator: gleich
          wert: "nein"
    schweregrad: hoch
    befund: Keine Datensicherung für das DMS vorhanden
    risiko: Bei Datenverlust, Fehlbedienung oder Cyberangriff können archivierte Dokumente unwiederbringlich verloren gehen; dies kann auch revisionssichere Aufbewahrungspflichten verletzen.
    empfehlung: Regelmäßige, unabhängige Datensicherung für das DMS einrichten.
    referenz: ""
    massnahme_vorschlag:
      bezeichnung: Datensicherung für DMS einrichten
      kosten_richtwert: 500
      aufwand_richtwert: 4
