schema_version: 1
typ: usv
bezeichnung_anzeige: USV (Unterbrechungsfreie Stromversorgung)
berichtskapitel: infrastruktur
abschnitte:
  - id: was_ist_es
    titel: Was ist es
    felder:
      - name: hersteller
        label: Hersteller
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: APC
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers APC /
                Schneider Electric zum Einsatz."
              auswirkung:
          - wert: Eaton
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Eaton
                zum Einsatz."
              auswirkung:
          - wert: Riello
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Riello
                zum Einsatz."
              auswirkung:
          - wert: Online_USV
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Online
                USV zum Einsatz."
              auswirkung:
          - wert: Vertiv
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Vertiv
                zum Einsatz."
              auswirkung:
          - wert: Generex
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Generex
                zum Einsatz."
              auswirkung:
          - wert: Socomec
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers Socomec
                zum Einsatz."
              auswirkung:
          - wert: CyberPower
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers CyberPower
                zum Einsatz."
              auswirkung:
          - wert: FSP
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät des Herstellers FSP
                zum Einsatz."
              auswirkung:
          - wert: Sonstiges
            textbaustein:
              feststellung: "Als USV-System kommt ein Gerät eines sonstigen Herstellers
                zum Einsatz."
              auswirkung:
          - wert: unbekannt
            textbaustein:

      - name: modell
        label: Modell
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Sonstiges
      - name: modell_apc
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: APC
        werte:
          - wert: Smart-UPS SMT1000
          - wert: Smart-UPS SMT1500
          - wert: Smart-UPS SMT2200
          - wert: Smart-UPS SMT3000
          - wert: Smart-UPS SMC1000
          - wert: Smart-UPS SMC1500
          - wert: Smart-UPS SMX750
          - wert: Smart-UPS SMX1000
          - wert: Smart-UPS SMX1500
          - wert: Smart-UPS SMX2200
          - wert: Smart-UPS SMX3000
          - wert: Smart-UPS SMTL1000
          - wert: Smart-UPS SMTL1500
          - wert: Smart-UPS SRT5K
          - wert: Smart-UPS SRT6K
          - wert: Smart-UPS SRT8K
          - wert: Smart-UPS SRT10K
          - wert: Back-UPS Pro BR1000
          - wert: Back-UPS Pro BR1500
          - wert: Back-UPS BX1500
          - wert: Back-UPS BE850
      - name: modell_eaton
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Eaton
        werte:
          - wert: 5P 650
          - wert: 5P 1000
          - wert: 5P 1500
          - wert: 5P 2200
          - wert: 5P 3000
          - wert: 9SX 5000
          - wert: 9SX 6000
          - wert: 9SX 8000
          - wert: 9SX 10000
          - wert: 9PX 700
          - wert: 9PX 1000
          - wert: 9PX 1500
          - wert: 9PX 2000
          - wert: 9PX 3000
          - wert: 9PX 5000
          - wert: 9PX 6000
          - wert: 9PX 8000
          - wert: 9PX 10000
          - wert: 93PM 100kVA
          - wert: 93PM 150kVA
          - wert: 93PM 200kVA

      - name: kapazitaet_va
        label: Kapazität (VA)
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich

      - name: ueberbrueckungszeit_minuten
        typ: zahl
        label: Überbrückungszeit (Min.)
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_ueberbrueckungszeit
          max_punkte: 10

      - name: versorgte_geraete_anzahl
        label: Anzahl versorgter Geräte
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich

      - name: auslastung_prozent
        label: Auslastung (%)
        typ: zahl
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_auslastung
          max_punkte: 10

  - id: zustand
    titel: In welchem Zustand ist es
    felder:
      - name: batterie_alter
        label: Alter der Batterie
        typ: auswahl
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: hardware_und_software
          kriterium: usv_batterie_alter
          max_punkte: 15
        werte:
          - wert: unter_3_jahre
            punkte: 15
            textbaustein:
              feststellung: "Die USV-Batterien sind jünger als drei Jahre und befinden
                sich im regulären Nutzungszyklus."
              auswirkung:
          - wert: 3_bis_5_jahre
            punkte: 8
            textbaustein:
              feststellung: "Die USV-Batterien sind zwischen drei und fünf Jahre alt."
              auswirkung: "Die Restkapazität der Akkus kann vermindert sein; ein Austausch
                sollte mittelfristig eingeplant werden."
          - wert: ueber_5_jahre
            punkte: 0
            textbaustein:
              feststellung: "Die USV-Batterien sind älter als fünf Jahre."
              auswirkung: "Akkus über fünf Jahre neigen zu spontanem Kapazitätsabfall
                unter Last, wodurch bei Stromausfall ein unkontrollierter Systemabsturz
                droht."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: garantie_geraet_bis
        label: Gerätegarantie gültig bis
        typ: datum
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_garantie_geraet
          max_punkte: 5

      - name: garantie_batterie_bis
        label: Batteriegarantie gültig bis
        typ: datum
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_garantie_batterie
          max_punkte: 5

      - name: wartungsvertrag_vorhanden
        label: Wartungsvertrag vorhanden
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_wartungsvertrag
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Für das USV-System besteht ein aktiver Wartungsvertrag
                inkl. Batterieservice."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Für das USV-System besteht kein Wartungsvertrag."
              auswirkung: "Bei Defekten oder Akku-Ausfällen steht kein vereinbarter
                Reaktions- und Ersatzteilservice zur Verfügung."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: letzter_batterietest
        label: Letzter Batterietest
        typ: datum
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_letzter_batterietest
          max_punkte: 15

  - id: ausfall
    titel: Was passiert bei Ausfall
    felder:
      - name: abschaltsignal_an_server
        label: Abschaltsignal an Server
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: usv_abschaltsignal
          max_punkte: 15
        werte:
          - wert: ja
            punkte: 15
            textbaustein:
              feststellung: "Eine Signalverbindung für den automatischen, geordneten
                Server-Shutdown ist konfiguriert."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Es ist keine Signalverbindung für einen automatischen
                Server-Shutdown eingerichtet."
              auswirkung: "Bei erschöpfter USV-Kapazität schalten die versorgten Server
                hart ab, was zu Dateisystem- und Datenbankschäden führen kann."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: signalisierungsart
        typ: auswahl
        label: Art der Signalisierung
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: abschaltsignal_an_server
          operator: gleich
          wert: ja
        werte:
          - wert: USB
            textbaustein:
              feststellung: "Die Abschaltsignalisierung erfolgt per USB mit lokaler
                Shutdown-Software (z. B. APC PowerChute, Eaton IPP, CyberPower PowerPanel)."
              auswirkung:
          - wert: RS232_seriell
            textbaustein:
              feststellung: "Die Abschaltsignalisierung erfolgt über eine serielle
                RS232-Verbindung."
              auswirkung:
          - wert: Netzwerk_SNMP_Karte
            textbaustein:
              feststellung: "Die Abschaltsignalisierung erfolgt über eine Netzwerk-/SNMP-Managementkarte
                in der USV."
              auswirkung:
          - wert: Relaiskontakt
            textbaustein:
              feststellung: "Die Abschaltsignalisierung erfolgt über einen Trockenkontakt
                / Relaisausgang der USV."
              auswirkung:
          - wert: Sonstiges
            textbaustein:
          - wert: unbekannt
            textbaustein:
      - name: kommentar
        label: Kommentar
        typ: mehrzeiliger_text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: intern
