schema_version: 1
typ: switch
bezeichnung_anzeige: Switch / Aktive Netzwerktechnik
berichtskapitel: netzwerk_und_internet
abschnitte:
  - id: allgemeine_angaben
    titel: Allgemeine Angaben
    felder:
      - name: hersteller
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: Cisco
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches des Herstellers Cisco zum
                Einsatz."
              auswirkung:
          - wert: Aruba_HPE
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Aruba / HPE zum Einsatz."
              auswirkung:
          - wert: Ubiquiti
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Ubiquiti UniFi zum Einsatz."
              auswirkung:
          - wert: Fortinet
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Fortinet (FortiSwitch)
                zum Einsatz."
              auswirkung:
          - wert: Dell
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Dell Networking zum Einsatz."
              auswirkung:
          - wert: Netgear
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Netgear zum Einsatz."
              auswirkung:
          - wert: Juniper
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Juniper (EX/QFX-Serie) zum Einsatz."
              auswirkung:
          - wert: Extreme_Networks
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Extreme Networks zum Einsatz."
              auswirkung:
          - wert: Zyxel
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Zyxel zum Einsatz."
              auswirkung:
          - wert: D-Link
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von D-Link zum Einsatz."
              auswirkung:
          - wert: TP-Link
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von TP-Link zum Einsatz."
              auswirkung:
          - wert: Brocade_Ruckus
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Brocade/Ruckus zum Einsatz."
              auswirkung:
          - wert: Allied_Telesis
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches von Allied Telesis zum Einsatz."
              auswirkung:
          - wert: Sonstiges
            textbaustein:
              feststellung: "Im Netzwerk kommen Switches eines sonstigen Herstellers
                zum Einsatz."
              auswirkung:
          - wert: unbekannt
            textbaustein:

      - name: modell
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Sonstiges
      - name: modell_cisco
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Cisco
        werte:
          - wert: Catalyst 2960
          - wert: Catalyst 2960-S
          - wert: Catalyst 2960-X
          - wert: Catalyst 2960-XR
          - wert: Catalyst 2960-C
          - wert: Catalyst 2960-L
          - wert: Catalyst 9200
          - wert: Catalyst 9200L
          - wert: Catalyst 9200CX
          - wert: Catalyst 9300
          - wert: Catalyst 9300X
          - wert: Catalyst 1000
          - wert: Catalyst 1200
          - wert: Catalyst 1300
          - wert: Business 110
          - wert: Business 220
          - wert: Business 250
          - wert: Business 350
          - wert: SG350
          - wert: SG550
      - name: modell_aruba_hpe
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Aruba_HPE
        werte:
          - wert: 2530-8
          - wert: 2530-24
          - wert: 2530-48
          - wert: 2530-8-PoE+
          - wert: 2530-24-PoE+
          - wert: 2530-48-PoE+
          - wert: 2930F-24G
          - wert: 2930F-48G
          - wert: 2930F-24G-PoE+
          - wert: 2930F-48G-PoE+
          - wert: 2930M-24G
          - wert: 2930M-48G
          - wert: 2930M-24G-PoE+
          - wert: 2930M-48G-PoE+
          - wert: 3810M-24G
          - wert: 3810M-48G
          - wert: CX 6300F-24Y
          - wert: CX 6300F-48Y
          - wert: CX 6300M-24Y
          - wert: CX 6300M-48Y
          - wert: CX 6300L-24Y
          - wert: CX 6300L-48Y
      - name: modell_dell
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Dell
        werte:
          - wert: N1108T-ON
          - wert: N1124T-ON
          - wert: N1148T-ON
          - wert: N1524
          - wert: N1548
          - wert: N2024
          - wert: N2048
          - wert: N2224X-ON
          - wert: N2248X-ON
          - wert: N3024
          - wert: N3048
          - wert: N3224T-ON
          - wert: N3248TE-ON
          - wert: N4032
          - wert: N4064
          - wert: S4128F-ON
          - wert: S4148F-ON
          - wert: S5224F-ON
          - wert: S5248F-ON
      - name: modell_ubiquiti
        label: Modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: hersteller
          operator: gleich
          wert: Ubiquiti
        werte:
          - wert: USW-Lite-8
          - wert: USW-Lite-16
          - wert: USW-24
          - wert: USW-48
          - wert: USW-Pro-24
          - wert: USW-Pro-48
          - wert: USW-Pro-24-PoE
          - wert: USW-Pro-48-PoE
          - wert: USW-Aggregation
          - wert: USW-Enterprise-24
          - wert: USW-Enterprise-48

      - name: port_anzahl
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich

      - name: geschwindigkeit
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: 1G
            textbaustein:
              feststellung: "Die Switches arbeiten mit 1 Gbit/s Portgeschwindigkeit."
              auswirkung:
          - wert: 2.5G
            textbaustein:
              feststellung: "Die Switches unterstützen Multigigabit (2,5 Gbit/s)."
              auswirkung:
          - wert: 10G
            textbaustein:
              feststellung: "Die Switches unterstützen 10 Gbit/s Port- / Uplinkgeschwindigkeiten."
              auswirkung:
          - wert: 25G
            textbaustein:
              feststellung: "Die Switches verfügen über High-Speed Uplinks mit 25
                Gbit/s."
              auswirkung:
          - wert: gemischt
            textbaustein:
              feststellung: "Im Netz kommen gemischte Portgeschwindigkeiten zum Einsatz."
              auswirkung:
          - wert: unbekannt
            textbaustein:

      - name: poe_vorhanden
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: ja
            textbaustein:
              feststellung: "Die Switches unterstützen Power-over-Ethernet (PoE) zur
                Stromversorgung von Endgeräten."
              auswirkung:
          - wert: nein
            textbaustein:
              feststellung: "Die Switches verfügen über keine PoE-Unterstützung."
              auswirkung:
          - wert: unbekannt
            textbaustein:

      - name: management_typ
        typ: auswahl
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: hardware_und_software
          kriterium: switch_management_typ
          max_punkte: 10
        werte:
          - wert: fully_managed
            punkte: 10
            textbaustein:
              feststellung: "Es kommen voll verwaltbare (Fully Managed) Switches zum
                Einsatz."
              auswirkung:
          - wert: smart_managed
            punkte: 7
            textbaustein:
              feststellung: "Es kommen Smart-Managed Switches mit grundlegenden Verwaltungsfunktionen
                zum Einsatz."
              auswirkung:
          - wert: unmanaged
            punkte: 0
            textbaustein:
              feststellung: "Es werden nicht-verwaltbare (Unmanaged) Switches eingesetzt."
              auswirkung: "Unmanaged Switches erlauben keine VLAN-Segmentierung, Protokollierung
                oder zentrale Überwachung."
          - wert: unbekannt
            punkte:
            textbaustein:

  - id: sicherheit_und_segmentierung
    titel: Sicherheit und Segmentierung
    felder:
      - name: netztrennung
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: it_security
          kriterium: switch_netztrennung
          max_punkte: 15
        werte:
          - wert: ja
            punkte: 15
            textbaustein:
              feststellung: "Eine Netztrennung mittels VLANs (z. B. Server, Clients,
                IoT, Gast) ist eingerichtet."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Es ist keine VLAN-Netztrennung konfiguriert; alle Systeme
                befinden sich in einer flachen Netzstruktur."
              auswirkung: "Ohne Netztrennung können sich Schadsoftware und Angreifer
                ungehindert im gesamten Unternehmensnetz ausbreiten."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: zugangsschutz_management
        typ: auswahl
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: it_security
          kriterium: switch_zugangsschutz_management
          max_punkte: 15
        werte:
          - wert: mfa_und_ssh_https
            punkte: 15
            textbaustein:
              feststellung: "Der Management-Zugriff erfolgt abgesichert über verschlüsselte
                Protokolle (SSH/HTTPS) und Mehrfaktor-Authentifizierung."
              auswirkung:
          - wert: ssh_https
            punkte: 10
            textbaustein:
              feststellung: "Der Management-Zugriff erfolgt über verschlüsselte Protokolle
                (SSH/HTTPS)."
              auswirkung:
          - wert: http_telnet
            punkte: 0
            textbaustein:
              feststellung: "Der Management-Zugriff auf Switches erlaubt unverschlüsselte
                Protokolle (HTTP / Telnet)."
              auswirkung: "Zugangsdaten und Konfigurationen können im Netzwerk im
                Klartext abgefangen werden."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: port_security_aktiv
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: it_security
          kriterium: switch_port_security
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Port Security oder 802.1X-Zugangskontrolle ist auf den
                Switchports aktiviert."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Port-Security / 802.1X ist nicht konfiguriert."
              auswirkung: "Jeder freie Netzwerkport in Büros oder Besprechungsräumen
                ermöglicht das Anstecken fremder Geräte."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: loop_protection_aktiv
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: switch_loop_protection
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Loop Protection / Spanning Tree Protocol (STP) ist aktiviert."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Spanning Tree / Loop Protection ist auf den Switches
                nicht aktiviert."
              auswirkung: "Versehentlich gesteckte Schleifen (Looping) führen zum
                sofortigen Ausfall des gesamten Netzwerks."
          - wert: unbekannt
            punkte:
            textbaustein:

  - id: wartung_und_sicherung
    titel: Wartung und Konfigurationssicherung
    felder:
      - name: firmware_aktuell
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: it_security
          kriterium: switch_firmware
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Die Switch-Firmware ist auf einem aktuellen Stand."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Die Switch-Firmware ist veraltet."
              auswirkung: "Bekannte Sicherheitslücken in der Switch-Software können
                von Angreifern ausgenutzt werden."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: garantie_bis
        typ: datum
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: switch_garantie
          max_punkte: 5

      - name: wartungsvertrag_vorhanden
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: switch_wartungsvertrag
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Für die Switches besteht ein aktiver Wartungsvertrag
                mit Vor-Ort-Service."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Es besteht kein Wartungsvertrag für die Switches."
              auswirkung: "Bei Hardwareausfällen steht kein zugesicherter Ersatzgeräte-Service
                zur Verfügung."
          - wert: unbekannt
            punkte:
            textbaustein:

      - name: konfigurationssicherung_aktuell
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: switch_konfig_sicherung
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Die Switch-Konfigurationen werden regelmäßig und automatisch
                gesichert."
              auswirkung:
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Die Switch-Konfigurationen werden nicht regelmäßig gesichert."
              auswirkung: "Im Austauschfall muss das Ersatzgerät zeitaufwendig von
                Grund auf neu konfiguriert werden."
          - wert: unbekannt
            punkte:
            textbaustein:

  - id: anbindung_und_verbindungen
    titel: Anbindung und Verbindungen
    felder:
      - name: anbindung_firewall_typ
        label: Anbindung an Firewall
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: single_link
            textbaustein:
              feststellung: Der Switch ist mit einem einzelnen Link an die 
                Firewall angebunden.
              auswirkung: Single Point of Failure für die Firewall-Anbindung.
          - wert: lag
            textbaustein:
              feststellung: Der Switch ist mit einem LAG (Link Aggregation 
                Group) an die Firewall angebunden.
              auswirkung: Redundante Anbindung mit Lastverteilung und 
                Failover-Fähigkeit.
          - wert: unbekannt
            textbaustein:
      - name: anbindung_firewall_geschwindigkeit_gbit
        label: Geschwindigkeit Firewall-Anbindung (Gbit)
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: anbindung_firewall_typ
          operator: gleich
          wert: single_link
      - name: cluster_verbund
        label: Cluster-Verbund
        typ: ja_nein
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: cluster_verbund_mitglieder
        label: Cluster-Mitglieder-Anbindung
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: cluster_verbund
          operator: gleich
          wert: ja
      - name: server_anbindung_geschwindigkeit
        label: Server-Anbindung Geschwindigkeit
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: 1g
            textbaustein:
              feststellung: Die Server sind mit 1 Gbit/s angebunden.
              auswirkung:
          - wert: 2_5g
            textbaustein:
              feststellung: Die Server sind mit 2,5 Gbit/s angebunden.
              auswirkung:
          - wert: 10g
            textbaustein:
              feststellung: Die Server sind mit 10 Gbit/s angebunden.
              auswirkung:
          - wert: gemischt
            textbaustein:
              feststellung: Die Server-Anbindung erfolgt mit gemischten 
                Geschwindigkeiten.
              auswirkung:
          - wert: unbekannt
            textbaustein:
      - name: server_anbindung_lag
        label: Server-Anbindung LAG
        typ: ja_nein
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: access_point_anbindung_geschwindigkeit
        label: Access-Point-Anbindung Geschwindigkeit
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: 1g
            textbaustein:
              feststellung: Access Points sind mit 1 Gbit/s angebunden.
              auswirkung:
          - wert: 2_5g
            textbaustein:
              feststellung: Access Points sind mit 2,5 Gbit/s angebunden.
              auswirkung:
          - wert: unbekannt
            textbaustein:
      - name: access_point_poe_stufe
        label: PoE-Stufe für Access-Points
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: poe
            textbaustein:
              feststellung: Die Access Points werden mit PoE (IEEE 802.3af) 
                versorgt.
              auswirkung: Bis zu 15,4 Watt pro Port.
          - wert: poe_plus
            textbaustein:
              feststellung: Die Access Points werden mit PoE+ (IEEE 802.3at) 
                versorgt.
              auswirkung: Bis zu 30 Watt pro Port.
          - wert: poe_plus_plus
            textbaustein:
              feststellung: Die Access Points werden mit PoE++ (IEEE 802.3bt) 
                versorgt.
              auswirkung: Bis zu 60 Watt pro Port.
          - wert: nicht_anwendbar
            textbaustein:
              feststellung: Keine PoE-Versorgung für Access Points erforderlich.
              auswirkung:
          - wert: unbekannt
            textbaustein:
      - name: vlan_segmentierung
        label: VLAN-Segmentierung
        typ: mehrzeiliger_text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: uplink_typen
        label: Uplink-Typen
        typ: liste
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        felder:
          - name: typ
            typ: auswahl
            label: Typ
            werte:
              - wert: trunk
              - wert: access
          - name: vlan_ids
            typ: text
            label: VLAN-IDs
      - name: redundante_uplinks
        label: Redundante Uplinks
        typ: ja_nein
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: switch_redundante_uplinks
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: Der Switch verfügt über redundante Uplinks.
              auswirkung: Ausfall eines Uplink-Ports führt nicht zum Verlust der
                Verbindung.
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: Der Switch hat keine redundanten Uplinks.
              auswirkung: Single Point of Failure für die Uplink-Verbindung.
      - name: kommentar
        label: Kommentar
        typ: mehrzeiliger_text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: intern
