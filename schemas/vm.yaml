schema_version: 1
typ: vm
bezeichnung_anzeige: Virtuelle Maschine (VM)
berichtskapitel: infrastruktur
abschnitte:
  - id: vm_daten
    titel: Virtuelle Maschine
    felder:
      - name: name
        label: Name
        typ: text
        pflicht: true
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: betriebssystem
        label: Betriebssystem
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: cpu_kerne
        label: CPU-Kerne
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: ram_gb
        label: RAM (GB)
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: festplatten_groesse_gb
        label: Festplattengröße (GB)
        typ: zahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: funktion_dienst
        label: Funktion/Dienst
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
      - name: host_referenz
        label: Host
        typ: objekt_referenz
        pflicht: true
        regelrelevant: true
        vertraulichkeit: kundentauglich
        ziel_typen: [server_virtualisierung, server_cluster]
      - name: ha_faehig
        label: HA-fähig
        typ: ja_nein
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: vm_ha_faehig
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: Die virtuelle Maschine ist HA-fähig konfiguriert.
              auswirkung: Bei Host-Ausfall wird die VM automatisch auf einen 
                anderen Knoten migriert.
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: Die virtuelle Maschine ist nicht HA-fähig.
              auswirkung: Bei Host-Ausfall fällt die VM aus und muss manuell neu
                gestartet werden.
      - name: kommentar
        label: Kommentar
        typ: mehrzeiliger_text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: intern
