schema_version: 1
typ: dms
bezeichnung_anzeige: DMS (Dokumentenmanagement)
berichtskapitel: business_software
abschnitte:
  - id: was_ist_es
    titel: Was ist es
    felder:
      - name: anbieter
        typ: auswahl
        pflicht: true
        regelrelevant: false
        vertraulichkeit: kundentauglich
        # SharePoint bewusst nicht als DMS-Option aufgeführt — zählt nicht als echtes DMS.
        werte:
          - wert: ELO
            textbaustein:
              feststellung: "Als Dokumentenmanagementsystem kommt ELO zum Einsatz."
              auswirkung: null
          - wert: DocuWare
            textbaustein:
              feststellung: "Als Dokumentenmanagementsystem kommt DocuWare zum Einsatz."
              auswirkung: null
          - wert: d.velop
            textbaustein:
              feststellung: "Als Dokumentenmanagementsystem kommt d.velop zum Einsatz."
              auswirkung: null
          - wert: enaio
            textbaustein:
              feststellung: "Als Dokumentenmanagementsystem kommt enaio zum Einsatz."
              auswirkung: null
          - wert: DATEV_DMS
            textbaustein:
              feststellung: "Als Dokumentenmanagement kommt DATEV DMS zum Einsatz — eine kanzleispezifische Lösung für Steuerberater/Wirtschaftsprüfer."
              auswirkung: null
          - wert: sonstige
            textbaustein:
              feststellung: "Als Dokumentenmanagementsystem kommt eine sonstige Lösung zum Einsatz."
              auswirkung: null
          - wert: unbekannt
            textbaustein: null

      - name: anbieter_freitext
        label: Anbieter (Sonstige)
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        sichtbar_wenn:
          feld: anbieter
          operator: gleich
          wert: sonstige

      - name: edition_version
        label: Edition / Version
        typ: text
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich

      - name: hosting_modell
        typ: auswahl
        pflicht: false
        regelrelevant: false
        vertraulichkeit: kundentauglich
        werte:
          - wert: cloud
            textbaustein:
              feststellung: "Das DMS wird als Cloud-/SaaS-Lösung betrieben."
              auswirkung: null
          - wert: on_premise
            textbaustein:
              feststellung: "Das DMS wird On-Premise im eigenen Rechenzentrum betrieben."
              auswirkung: null
          - wert: hybrid
            textbaustein:
              feststellung: "Das DMS wird in einer hybriden Konfiguration betrieben."
              auswirkung: null
          - wert: unbekannt
            textbaustein: null

  - id: zustand
    titel: In welchem Zustand ist es
    felder:
      - name: wartungsvertrag_support_vorhanden
        label: Wartungs-/Supportvertrag vorhanden
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: dms_wartungsvertrag_support
          max_punkte: 10
        werte:
          - wert: ja
            punkte: 10
            textbaustein:
              feststellung: "Für das DMS besteht ein aktiver Wartungs-/Supportvertrag."
              auswirkung: null
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Für das DMS besteht kein Wartungs-/Supportvertrag."
              auswirkung: "Bei Störungen oder Fehlern steht kein vereinbarter Herstellersupport zur Verfügung."
          - wert: unbekannt
            punkte: null
            textbaustein: null

      - name: datensicherung_vorhanden
        label: Datensicherung der DMS-Daten vorhanden
        typ: ja_nein_unbekannt
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: betriebsrisiken
          kriterium: dms_datensicherung
          max_punkte: 20
        werte:
          - wert: ja
            punkte: 20
            textbaustein:
              feststellung: "Die Daten des DMS werden regelmäßig gesichert."
              auswirkung: null
          - wert: nein
            punkte: 0
            textbaustein:
              feststellung: "Für die Daten des DMS besteht keine Datensicherung."
              auswirkung: "Bei Datenverlust, Fehlbedienung oder Cyberangriff können archivierte Dokumente unwiederbringlich verloren gehen; dies kann auch revisionssichere Aufbewahrungspflichten verletzen."
          - wert: unbekannt
            punkte: null
            textbaustein: null

      - name: dokumentation_vorhanden
        typ: auswahl
        pflicht: false
        regelrelevant: true
        vertraulichkeit: kundentauglich
        bewertung:
          kategorie: rechtliche_anforderungen
          kriterium: dms_dokumentation
          max_punkte: 10
        werte:
          - wert: vollstaendig
            punkte: 10
            textbaustein:
              feststellung: "Eine vollständige Dokumentation des DMS liegt vor."
              auswirkung: null
          - wert: teilweise
            punkte: 5
            textbaustein:
              feststellung: "Die Dokumentation des DMS ist nur teilweise vorhanden."
              auswirkung: null
          - wert: keine
            punkte: 0
            textbaustein:
              feststellung: "Es liegt keine Dokumentation für das DMS vor."
              auswirkung: "Im Störungs- oder Vertretungsfall verzögert die fehlende Dokumentation die Analyse und Behebung von Fehlern."
          - wert: unbekannt
            punkte: null
            textbaustein: null
