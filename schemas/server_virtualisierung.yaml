schema_version: 1
typ: server_virtualisierung
bezeichnung_anzeige: Server & Virtualisierung
berichtskapitel: infrastruktur
abschnitte:
- id: was_ist_es
  titel: Was ist es
  felder:
  - name: hypervisor_typ
    label: Hypervisor / Virtualisierungslösung
    typ: auswahl
    pflicht: true
    regelrelevant: false
    vertraulichkeit: kundentauglich
    werte:
    - wert: vmware_vsphere
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt VMware ESXi / vSphere zum
          Einsatz.
        auswirkung: null
    - wert: hyper_v
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt Microsoft Hyper-V zum Einsatz.
        auswirkung: null
    - wert: proxmox
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt Proxmox VE zum Einsatz.
        auswirkung: null
    - wert: xenserver
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt XenServer / XCP-ng zum Einsatz.
        auswirkung: null
    - wert: nutanix
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt Nutanix AHV zum Einsatz.
        auswirkung: null
    - wert: bare_metal
      textbaustein:
        feststellung: Die Server werden ohne Virtualisierungsschicht direkt auf der
          Hardware (Bare Metal) betrieben.
        auswirkung: null
    - wert: sonstiges
      textbaustein:
        feststellung: Als Virtualisierungsplattform kommt ein sonstiges System zum
          Einsatz.
        auswirkung: null
    - wert: unbekannt
      textbaustein: null
  - name: hypervisor_version
    label: Hypervisor Version
    typ: text
    pflicht: false
    regelrelevant: false
    vertraulichkeit: kundentauglich
  - name: anzahl_host_server
    label: Anzahl Host-Server (Physisch)
    typ: zahl
    pflicht: false
    regelrelevant: false
    vertraulichkeit: kundentauglich
  - name: anzahl_vms
    label: Anzahl Virtuelle Maschinen (VMs)
    typ: zahl
    pflicht: false
    regelrelevant: false
    vertraulichkeit: kundentauglich
  - name: betriebssysteme_vms
    label: Betriebssysteme der VMs
    typ: text
    pflicht: false
    regelrelevant: false
    vertraulichkeit: kundentauglich
  - name: ip_adressen
    label: IP-Adressen / Management-IPs
    typ: text
    pflicht: false
    regelrelevant: false
    vertraulichkeit: intern
- id: zustand
  titel: In welchem Zustand ist es
  felder:
  - name: hardware_alter
    label: Alter der Host-Hardware
    typ: auswahl
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: hardware_und_software
      kriterium: hardware_alter_server
      max_punkte: 5
    werte:
    - wert: unter_3_jahre
      punkte: 5
      textbaustein:
        feststellung: Die Server-Hardware ist jünger als 3 Jahre.
        auswirkung: null
    - wert: 3_bis_5_jahre
      punkte: 3
      textbaustein:
        feststellung: Die Server-Hardware ist 3 bis 5 Jahre alt. Ein Austausch sollte
          mittelfristig geplant werden.
        auswirkung: null
    - wert: ueber_5_jahre
      punkte: 0
      textbaustein:
        feststellung: Die Server-Hardware ist älter als 5 Jahre und sollte aus Sicherheits-
          und Performancegründen ausgetauscht werden.
        auswirkung: Die Ausfallwahrscheinlichkeit steigt mit fortschreitendem Alter
          deutlich an und moderne Sicherheitsfunktionen werden nicht unterstützt.
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: wartungsvertrag_vorhanden
    label: Herstellersupport / Wartungsvertrag vorhanden
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: betriebsrisiken
      kriterium: wartungsvertrag_server
      max_punkte: 10
    werte:
    - wert: ja
      punkte: 10
      textbaustein:
        feststellung: Für die Server-Hardware besteht ein aktiver Wartungsvertrag
          des Herstellers.
        auswirkung: null
    - wert: nein
      punkte: 0
      textbaustein:
        feststellung: Für die Server-Hardware besteht kein aktiver Wartungsvertrag.
        auswirkung: Bei Hardwaredefekten oder technischen Störungen steht kein direkter
          Herstellersupport zur Verfügung, was die Wiederherstellungszeit verlängern
          kann.
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: wartungsvertrag_bis
    label: Wartungsvertrag gültig bis
    typ: datum
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
  - name: hypervisor_eol
    label: Hypervisor End-of-Life (EOL)
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: hardware_und_software
      kriterium: hypervisor_eol_server
      max_punkte: 15
    werte:
    - wert: ja
      punkte: 0
      textbaustein:
        feststellung: Die Hypervisor-Software hat ihren End-of-Life Status erreicht
          und erhält keine Updates mehr.
        auswirkung: null
    - wert: nein
      punkte: 15
      textbaustein:
        feststellung: Die Hypervisor-Software wird vom Hersteller offiziell unterstützt.
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: os_eol_vms_vorhanden
    label: EOL-Betriebssysteme auf VMs vorhanden
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: hardware_und_software
      kriterium: vm_os_eol_server
      max_punkte: 15
    werte:
    - wert: ja
      punkte: 0
      textbaustein:
        feststellung: Es sind noch veraltete Betriebssysteme (End-of-Life) auf den
          virtuellen Maschinen im Einsatz.
        auswirkung: null
    - wert: nein
      punkte: 15
      textbaustein:
        feststellung: Alle Server-Betriebssysteme sind auf unterstützten Versionen.
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: patchstand_aktuell
    label: Patchstand Server & Hypervisor aktuell
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: it_security
      kriterium: patchstand_server
      max_punkte: 15
    werte:
    - wert: ja
      punkte: 15
      textbaustein:
        feststellung: Sicherheits-Patches für Server und Hypervisor werden regelmäßig
          eingespielt.
        auswirkung: null
    - wert: nein
      punkte: 0
      textbaustein:
        feststellung: Der Patchstand der Server- und Virtualisierungsumgebung ist
          veraltet.
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: dokumentation_vorhanden
    label: Systemdokumentation vorhanden
    typ: auswahl
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: rechtliche_anforderungen
      kriterium: dokumentation_server
      max_punkte: 10
    werte:
    - wert: vollstaendig
      punkte: 10
      textbaustein:
        feststellung: Eine vollständige Server- und Netzwerkkonfigurations-Dokumentation
          liegt vor.
        auswirkung: null
    - wert: teilweise
      punkte: 5
      textbaustein:
        feststellung: Die Dokumentation der Serverumgebung ist nur unvollständig vorhanden.
        auswirkung: null
    - wert: keine
      punkte: 0
      textbaustein:
        feststellung: Es ist keine Dokumentation der Serverumgebung vorhanden.
        auswirkung: Im Störungs- oder Vertretungsfall verzögert die fehlende Dokumentation
          die Analyse und Behebung von Fehlern.
    - wert: unbekannt
      punkte: null
      textbaustein: null
- id: ausfall
  titel: Was passiert bei Ausfall
  felder:
  - name: ha_cluster_eingerichtet
    label: Hochverfügbarkeits-Cluster (HA) eingerichtet
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: betriebsrisiken
      kriterium: ha_cluster_server
      max_punkte: 15
    werte:
    - wert: ja
      punkte: 15
      textbaustein:
        feststellung: Die Virtualisierung ist als hochverfügbares Cluster mit automatischer
          Failover-Funktion aufgebaut.
        auswirkung: null
    - wert: nein
      punkte: 0
      textbaustein:
        feststellung: Es ist kein Hochverfügbarkeits-Cluster vorhanden (Single Point
          of Failure bei Hostausfall).
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: redundante_netzteil_stromversorgung
    label: Redundante Netzteile verbaut
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: betriebsrisiken
      kriterium: netzteil_redundanz_server
      max_punkte: 10
    werte:
    - wert: ja
      punkte: 10
      textbaustein:
        feststellung: Die Server-Hosts verfügen über redundante Netzteile.
        auswirkung: null
    - wert: nein
      punkte: 0
      textbaustein:
        feststellung: Die Server-Hosts besitzen keine redundante Stromversorgung.
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: raid_konfiguration
    label: RAID-Absicherung des lokalen/SAN-Speichers
    typ: auswahl
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: betriebsrisiken
      kriterium: raid_server
      max_punkte: 10
    werte:
    - wert: raid_10_oder_6
      punkte: 10
      textbaustein:
        feststellung: Der Datenspeicher ist durch hochredundantes RAID (RAID 6 / RAID
          10) geschützt.
        auswirkung: null
    - wert: raid_1_oder_5
      punkte: 5
      textbaustein:
        feststellung: Der Datenspeicher ist durch Standard-RAID (RAID 1 / RAID 5)
          geschützt.
        auswirkung: null
    - wert: raid_0_oder_kein_raid
      punkte: 0
      textbaustein:
        feststellung: Der Speicher bietet keine Redundanz (RAID 0 oder kein RAID).
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
- id: funktionen
  titel: Funktionen und Überwachung
  felder:
  - name: monitoring_aktiv
    label: Zentrales Monitoring der Server/VMs aktiv
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: true
    vertraulichkeit: kundentauglich
    bewertung:
      kategorie: betriebsrisiken
      kriterium: monitoring_server
      max_punkte: 5
    werte:
    - wert: ja
      punkte: 5
      textbaustein:
        feststellung: Die Server und virtuellen Maschinen werden kontinuierlich überwacht.
        auswirkung: null
    - wert: nein
      punkte: 0
      textbaustein:
        feststellung: Es ist kein automatisches Server-Monitoring eingerichtet.
        auswirkung: null
    - wert: unbekannt
      punkte: null
      textbaustein: null
  - name: snapshot_management
    label: Reguläres Konsolidieren/Löschen alter VM-Snapshots
    typ: ja_nein_unbekannt
    pflicht: false
    regelrelevant: false
    vertraulichkeit: kundentauglich
    werte:
    - wert: ja
      textbaustein:
        feststellung: VM-Snapshots werden regelmäßig bereinigt.
        auswirkung: null
    - wert: nein
      textbaustein:
        feststellung: Alte VM-Snapshots verbleiben unbeaufsichtigt auf dem Datenspeicher.
        auswirkung: null
    - wert: unbekannt
      textbaustein: null
