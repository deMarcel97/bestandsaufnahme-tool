[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bestandsaufnahme-tool"
version = "2.7.41"

description = "Tool für IT-Bestandsaufnahmen beim Kunden"
authors = [{ name = "IT Systemhaus" }]
requires-python = ">=3.10"
# Die Laufzeit-Abhängigkeiten stehen in requirements.txt, damit Dockerfile
# und deploy/install.sh dieselbe Liste nutzen können, statt sie zu duplizieren.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["app"]
