[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bestandsaufnahme-tool"
version = "2.2.0"
description = "Tool für IT-Bestandsaufnahmen beim Kunden"
authors = [{ name = "IT Systemhaus" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.3",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
