# Reverse Proxy für das IT-Bestandsaufnahme-Tool.
#
# WICHTIG: Es ist derzeit kein Login aktiv (Entra-ID-SSO ist nicht
# konfiguriert). Die einzige Zugriffskontrolle vor den Kundendaten ist die
# IP-Beschränkung weiter unten. Diese darf nur zusammen mit der Aktivierung
# von Entra ID entfernt werden — siehe README.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # ── Zugriffsbeschränkung ─────────────────────────────────────────────
    # Erlaubte Quell-Netze (internes LAN / VPN). Wird von install.sh aus
    # ALLOW_CIDRS erzeugt.
__ALLOW_RULES__
    deny all;

    # Uploads (Fotos zur Bestandsaufnahme) brauchen mehr als die 1 MB Default.
    client_max_body_size 25m;

    access_log /var/log/nginx/bestandsaufnahme-tool.access.log;
    error_log  /var/log/nginx/bestandsaufnahme-tool.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # Der .docx-Export kann bei grossen Aufträgen länger dauern als die
        # 60s-Default von nginx.
        proxy_read_timeout 300s;
    }
}
